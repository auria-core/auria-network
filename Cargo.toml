[package]
name = "auria-network"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/auria-core/auria-runtime"
authors = ["AURIA Team <auria@dust.llc>"]
description = "AURIA Runtime Core - P2P networking"

[dependencies]
auria-core = { path = "../auria-core", version = "0.1.0"}
auria-execution = { path = "../auria-execution", version = "0.1.0"}
auria-config = { path = "../auria-config", version = "0.1.0"}
auria-router = { path = "../auria-router", version = "0.1.0"}
auria-backend-cpu = { path = "../auria-backend-cpu", version = "0.1.0"}
auria-observability = { path = "../auria-observability", version = "0.1.0"}
auria-settlement = { path = "../auria-settlement", version = "0.1.0"}
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", features = ["sink"] }
futures = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"
http-body-util = "0.1"

